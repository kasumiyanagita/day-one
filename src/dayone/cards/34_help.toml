command = "--help"
category = "調べる"
title = "コマンドの使い方を表示する"
summary = "ほとんどのコマンドは、`--help` を付けて実行すると、自分の使い方とオプションの一覧を表示します。"
when = "オプションの名前を思い出せないとき。初めて使うコマンドで、何ができるかをざっと知りたいとき。"
syntax = "コマンド --help"

[vars]
cmd = ["touch", "rm", "mv", "cat"]

[[try]]
say = "`mkdir --help` と打ってみましょう。"
run = "mkdir --help"
after = "1 行目が書式、そのあとがオプションの一覧です。`mkdir` を覚えたときに使った `-p` も載っています。"

[[try]]
say = "オプションの多いコマンドは、説明も長くなります。パイプで `head` につなげば、最初の部分だけを読めます。`ls --help | head -n 12` と打ってみましょう。"
run = "ls --help | head -n 12"
after = "長い説明も、これまでに覚えたコマンドと組み合わせれば読みやすくなります。`| less` につなげば、1 画面ずつ読めます。"

[challenge]
ask = "`{{cmd}}` コマンドの使い方を表示してください。"
solution = "{{cmd}} --help"
uses = ["{{cmd}}"]
hints = [
    "調べたいコマンドの名前のあとに、`--help` を付けます。",
    "`{{cmd}} --help` と打ちます。",
]
done = "コマンドやオプションを全部覚える必要はありません。「`--help` を見れば分かる」と知っていれば十分です。"
