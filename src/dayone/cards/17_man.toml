command = "man"
category = "調べる"
title = "マニュアルを読む"
summary = "コマンドの詳しい説明書(マニュアル)を表示します。`--help` より詳しく、使用例や注意点まで載っています。"
when = "`--help` の説明では足りないとき。オプションの正確な意味を確かめたいとき。"
syntax = "man コマンド"

[vars]
cmd = ["cp", "mv", "head", "tail"]

[[try]]
say = "`man ls` と打つと、`ls` のマニュアルが開きます。操作は `less` と同じで、**Space** で次の画面、**b** で前の画面、**q** で終了です。少し眺めたら `q` で戻ってきてください。"
run = "man ls"
after = "NAME(名前と概要)、SYNOPSIS(書式)、DESCRIPTION(説明とオプション)の順に書かれています。`/` に続けて言葉を打てば、中を検索できます。"

[challenge]
ask = "`{{cmd}}` のマニュアルを開き、少し読んでから `q` で閉じてください。"
solution = "man {{cmd}}"
check = "command"
hints = [
    "`man` のあとに、調べたいコマンドの名前を書きます。閉じるときは `q` です。",
    "`man {{cmd}}` と打ち、読み終えたら `q` を押します。",
]
done = "`man` は manual の略です。マニュアルは英語のことが多いですが、SYNOPSIS とオプションの一覧を見るだけでも役に立ちます。"
