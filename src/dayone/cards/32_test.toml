command = "test"
category = "スクリプトを書く準備"
title = "条件が成り立つかを調べる"
summary = "「ファイルがあるか」「数が大きいか」といった条件を調べます。結果は画面ではなく、終了コード(成功なら 0、失敗なら 1)で返します。"
when = "スクリプトの中で、「ファイルがあるときだけ処理する」「件数が多すぎたら知らせる」のように、場合分けをしたいとき。"
syntax = "test 条件   または   [ 条件 ]"

[vars]
name = ["memo.txt", "nai.txt", "todo.txt"]

[[files]]
path = "memo.txt"
content = "牛乳を買う\n"

[[files]]
path = "logs/app.log"
content = "起動しました\n"

[[try]]
say = "`test -f memo.txt; echo $?` と打ってみましょう。`test -f` は「その名前のファイルがあるか」を調べ、`echo $?` は、直前のコマンドの終了コードを表示します。"
run = "test -f memo.txt; echo $?"
after = "`0` と表示されました。`memo.txt` はあるので、条件が成り立った(成功した)という意味です。`test` 自身は、何も表示しません。"

[[try]]
say = "ないファイルで試します。`test -f nai.txt; echo $?` と打ってみましょう。"
run = "test -f nai.txt; echo $?"
after = "`1` と表示されました。0 が「成り立つ」、0 以外が「成り立たない」です。ふだんの感覚と逆なので、注意が必要です。"

[[try]]
say = "`test` は `[ ]` とも書けます。`[ -d logs ] && echo あります` と打ってみましょう。`-d` は「ディレクトリがあるか」、`&&` は「前が成功したら、後ろを実行する」という意味です。"
run = "[ -d logs ] && echo あります"
after = "`logs` ディレクトリがあるので、`あります` と表示されました。`[` の後ろと `]` の前には、空白が必要です。"

[[try]]
say = "数も比べられます。`[ 12 -gt 10 ] && echo 多い` と打ってみましょう。`-gt` は greater than(より大きい)の略です。"
run = "[ 12 -gt 10 ] && echo 多い"
after = "12 は 10 より大きいので、`多い` と表示されました。ほかに `-lt`(より小さい)、`-eq`(等しい)、`-ne`(等しくない)があります。"

[challenge]
ask = "`{{name}}` というファイルがあるかどうかを `test` で調べ、続けて `echo $?` で、その結果の終了コードを表示してください。"
solution = "test -f {{name}}; echo $?"
hints = [
    "ファイルがあるかを調べる条件は `-f` です。`;` で区切って、`echo $?` を続けます。",
    "`test -f {{name}}; echo $?` と打ちます。",
]
done = "スクリプトでは、`if [ 条件 ]; then … fi` の形で使います。`[ $# -ne 2 ]`(引数が 2 個でない)や `[ ! -f \"$1\" ]`(ファイルがない。`!` は否定)のように書いて、使い方の間違いを先に調べるのが定番です。"
