command = "which"
category = "調べる"
title = "コマンドの置き場所を調べる"
summary = "コマンドの名前を打ったときに、実際にどのファイルが実行されるのかを表示します。"
when = "そのコマンドがこのコンピューターに入っているか確かめたいとき。同じ名前のコマンドが複数あって、どれが使われているか知りたいとき。"
syntax = "which コマンド"

[vars]
cmd = ["cat", "cp", "head", "less", "man"]

[[try]]
say = "`which ls` と打ってみましょう。"
run = "which ls"
after = "ファイルの場所が表示されました。`ls` のようなコマンドの正体は、こうしてどこかに置かれているプログラムのファイルです。"

[challenge]
ask = "`{{cmd}}` コマンドの実体がどこにあるか、表示してください。"
solution = "which {{cmd}}"
hints = [
    "`which` のあとに、調べたいコマンドの名前を書きます。",
    "`which {{cmd}}` と打ちます。",
]
done = "入っていないコマンドの名前を渡すと、`which` は何も表示しません。「このコマンドは使えるかな」と思ったら、まず `which` で確かめられます。"
