command = "awk"
category = "絞り込む・数える"
title = "列を指定して取り出す"
summary = "1 行を空白で区切った「列」として扱い、指定した列を取り出したり、列の値で行を絞り込んだりします。"
when = "ログの中の決まった列(送信元や結果の番号など)だけを取り出したいとき。「3 列目が 500 の行」のように、列の値で絞り込みたいとき。"
syntax = "awk '条件 {print $列の番号}' ファイル"

[vars]
status = ["500", "404", "403"]

[[files]]
path = "access.log"
content = """10.0.0.5 200 /index.html 1500
10.0.0.9 404 /old.html 320
10.0.0.5 200 /img/500.png 4200
10.0.0.3 500 /api/order 180
10.0.0.7 403 /admin 210
10.0.0.9 404 /favicon.ico 320
10.0.0.3 500 /api/order 180
10.0.0.8 200 /about.html 500
10.0.0.2 403 /admin 210
10.0.0.6 500 /api/pay 190
10.0.0.5 200 /index.html 1500
10.0.0.4 404 /404-test 404
"""

[[try]]
say = "`access.log` は、1 行が「送信元 結果の番号 見に来た場所 大きさ」の 4 列でできています。`awk '{print $1}' access.log` と打って、1 列目(送信元)だけを取り出してみましょう。"
run = "awk '{print $1}' access.log"
after = "各行の 1 列目だけが表示されました。`$1` は 1 列目、`$2` は 2 列目を表します。`'…'` で囲むのは、`$` や `{}` をシェルに解釈させず、そのまま `awk` に渡すためです。"

[[try]]
say = "次は、列の値で行を絞り込みます。`awk '$2 == 404' access.log` と打って、2 列目が `404` の行だけを表示してみましょう。"
run = "awk '$2 == 404' access.log"
after = "2 列目が `404` の行だけになりました。最後の行は 3 列目と 4 列目にも `404` がありますが、選ばれた理由は 2 列目です。`grep 404` と違って、どの列を見るかを指定できます。"

[[try]]
say = "絞り込みと取り出しは、1 つにまとめられます。`awk '$2 == 404 {print $1}' access.log` と打ってみましょう。"
run = "awk '$2 == 404 {print $1}' access.log"
after = "「2 列目が `404` の行について、1 列目を表示する」という意味です。条件を前に、やることを `{}` の中に書きます。"

[challenge]
ask = "`access.log` から、2 列目(結果の番号)が `{{status}}` の行について、1 列目(送信元)だけを表示してください。"
solution = "awk '$2 == {{status}} {print $1}' access.log"
hints = [
    "条件は `$2 == {{status}}`、やることは `{print $1}` です。この 2 つを並べて `'…'` で囲みます。",
    "`awk '$2 == {{status}} {print $1}' access.log` と打ちます。",
]
done = "この結果に `| sort | uniq -c | sort -rn` をつなげると、「その番号を返された回数が多い送信元」の順位表になります。oncall の最初のインシデント「深夜の 500 祭り」は、この組み合わせで解けます。"
