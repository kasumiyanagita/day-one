command = "vim-edit"
category = "ファイルを編集する"
title = "vim で文字や行を消す"
summary = "`vim` で開いたファイルの中を矢印キーで移動し、いらない文字や行を消します。間違えた操作は取り消せます。"
when = "設定ファイルから不要な行を消したいとき。打ち間違えた文字を直したいとき。"
syntax = "vim ファイル"

[vars]
item = ["本を返す", "部屋を掃除する", "手紙を出す"]

[[files]]
path = "practice.txt"
content = "1 行目: これは練習用のファイルです。\n2 行目: 好きなところを消してみましょう。\n3 行目: 間違えても u で元に戻せます。\n4 行目: 保存しなければ、ファイルは変わりません。\n"

[[files]]
path = "todo.txt"
content = "牛乳を買う\n本を返す\n部屋を掃除する\n手紙を出す\n"

[[try]]
say = "`vim practice.txt` で開き、矢印キーでカーソルを動かしてみましょう。消したい文字の上で **x** を押すと、その 1 文字が消えます。**u** を押すと、消した文字が 1 つずつ元に戻ります。試し終えたら、最後は **:q!** と Enter で、保存せずに閉じてください。"
run = "vim practice.txt"
interactive = true
after = "`x` は 1 文字消す、`u` は直前の操作の取り消し(undo)です。`:q!` は、変更を保存せずに閉じます。"

[[try]]
say = "もう一度 `vim practice.txt` で開きます。消したい行にカーソルを合わせて **dd**(d を 2 回)と押すと、その行がまるごと消えます。1 行消したら、**:wq** と Enter で保存して閉じてください。"
run = "vim practice.txt"
interactive = true
after = "`dd` は 1 行消す操作です。違う行を消してしまっても、保存する前なら `u` で戻せます。"

[challenge]
ask = "`vim` で `todo.txt` を開き、`{{item}}` の行を消して保存してください。ほかの行は残します。"
# お手本は画面を使わない書き方にする(正解を求めるときは、キーを打つ人がいないため)
solution = "vim -es -i NONE -c '/^{{item}}$/d' -c wq todo.txt"
check = "files"
uses = ["vim"]
hints = [
    "`vim todo.txt` で開き、矢印キーで `{{item}}` の行へ移動して `dd` を押します。",
    "消せたら `:wq` と Enter で保存します。違う行を消してしまったら、`u` で戻すか、`:q!` で閉じてやり直します。",
]
done = "`x`、`dd`、`u` はどれも、開いた直後の状態で使う命令です。`i` で文字を書いている途中なら、先に `Esc` を押します。`vim` にはほかにも多くの操作があり、`vimtutor` というコマンドで続きを練習できます。"
